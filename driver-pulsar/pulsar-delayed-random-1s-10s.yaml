name: Pulsar-delayed-random-1s-10s
driverClass: io.openmessaging.benchmark.driver.pulsar.PulsarBenchmarkDriver

# Pulsar client-specific configuration
client:
  serviceUrl: pulsar://beijing-1-pulsar-broker.pulsar.svc.cluster.local:6650
  httpUrl: http://beijing-1-pulsar-broker.pulsar.svc.cluster.local:8080
  ioThreads: 8
  connectionsPerBroker: 8
  clusterName: beijing-1
  namespacePrefix: benchmark/ns
  topicType: persistent
  persistence:
    ensembleSize: 2
    writeQuorum: 2
    ackQuorum: 2
    deduplicationEnabled: true
  tlsAllowInsecureConnection: false
  tlsEnableHostnameVerification: false
  tlsTrustCertsFilePath:
  authentication:
    plugin:
    data:

# Producer configuration
producer:
  batchingEnabled: true
  batchingMaxPublishDelayMs: 1
  blockIfQueueFull: true
  pendingQueueSize: 1000
  # Per-message random delay between 1s and 10s.
  messageDelayMs: 2000
  minMessageDelayMs: 2000
  maxMessageDelayMs: 5000
  # Ratio of messages that will be sent with broker-side delivery delay.
  # 1.0 means all messages are delayed, values between 0.0 and 1.0 will delay that fraction.
  delayMessageRatio: 1.0

# Consumer configuration

consumer:
  subscriptionType: Shared
  subscriptionMode: Durable