apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-driver
  labels:
    app: {{ .Release.Name }}
    role: driver
spec:
  {{- with .Values.driverNodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.driverTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.results.enabled }}
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: {{ required "results.existingClaim is required when results.enabled=true" .Values.results.existingClaim }}
  {{- end }}
  containers:
    - name: {{ .Release.Name }}-driver
      imagePullPolicy: {{ .Values.imagePullPolicy }}
      image: {{ include "benchmark.image" . }}
      resources:
        limits:
          memory: {{ .Values.driverMemoryLimit }}
          {{- if .Values.driverCpuLimit }}
          cpu: {{ .Values.driverCpuLimit }}
          {{- end }}
        requests:
          memory: {{ .Values.driverMemoryRequest }}
          {{- if .Values.driverCpuRequest }}
          cpu: {{ .Values.driverCpuRequest }}
          {{- end }}
      env:
        - name: NUM_WORKERS
          value: "{{ .Values.numWorkers }}"
        - name: WORKERS
          value: '{{ template "workers" (dict "values" .Values "release" .Release) }}'
        - name: HEAP_OPTS
          value: {{ .Values.driverHeapOpts | quote }}
      {{- if .Values.results.enabled }}
      volumeMounts:
        - name: results
          mountPath: {{ .Values.results.mountPath }}
      {{- end }}
      command: ["sh", "-c"]
      args:
        - >
          echo "bin/benchmark --drivers {{ .Values.driver }} --workers $WORKERS {{ .Values.workload }}" > example-run.sh &&
          tail -f /dev/null
