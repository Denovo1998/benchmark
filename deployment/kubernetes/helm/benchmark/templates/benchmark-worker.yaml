apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: {{ .Release.Name }}
    component: worker
spec:
  serviceName: {{ .Release.Name }}-worker
  replicas: {{ .Values.numWorkers }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: worker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: worker
    spec:
      {{- with .Values.workerNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-worker
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          image: {{ include "benchmark.image" . }}
          {{- if or .Values.workersMemoryRequest .Values.workersMemoryLimit .Values.workersCpuRequest .Values.workersCpuLimit }}
          resources:
            limits:
              {{- if .Values.workersMemoryLimit }}
              memory: {{ .Values.workersMemoryLimit }}
              {{- end }}
              {{- if .Values.workersCpuLimit }}
              cpu: {{ .Values.workersCpuLimit }}
              {{- end }}
            requests:
              {{- if .Values.workersMemoryRequest }}
              memory: {{ .Values.workersMemoryRequest }}
              {{- end }}
              {{- if .Values.workersCpuRequest }}
              cpu: {{ .Values.workersCpuRequest }}
              {{- end }}
          {{- end }}
          command: ["sh", "-c"]
          args:
            - >
              bin/benchmark-worker
          ports:
            - containerPort: 8080
            - containerPort: 8081
---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: {{ .Release.Name }}
    component: worker
    role: worker
spec:
  ports:
    - port: 8080
      name: http
    - port: 8081
      name: stats
  clusterIP: None
  selector:
    app: {{ .Release.Name }}
    component: worker
