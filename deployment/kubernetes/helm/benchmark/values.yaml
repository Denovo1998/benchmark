#
# The Nereus v0.1.0 campaign uses exactly two workers on the apps node:
# one producer worker and one consumer worker. Keep this fixed across A-E.
numWorkers: 2
image: openmessaging/openmessaging-benchmark:pulsar
# Optional immutable OCI target digest. When set, Pods use image@digest rather
# than the mutable tag above.
imageDigest: ""
# Use local node image when available; override to Always if you rely on registry updates.
imagePullPolicy: IfNotPresent
workload: workloads/1-topic-100-partitions-1kb-4p-4c-100k.yaml
driver: driver-pulsar/pulsar.yaml

# Resource Configurations
driverMemoryRequest: 4Gi
driverMemoryLimit: 4Gi
# Java heap options for the driver (OpenMessaging Benchmark).
# Keep Xmx <= driverMemoryLimit to avoid JVM startup failures / OOM kills.
driverHeapOpts: "-Xms2048m -Xmx2048m"

# Formal campaigns pin driver and worker placement so the OMB side is identical
# across A-E. Leave empty for the historical local chart behavior.
driverNodeSelector: {}
workerNodeSelector: {}
driverTolerations: []
workerTolerations: []

# A PVC is required for formal run evidence. The driver writes result.json,
# manifest.json and copied YAML inputs below this path.
results:
  enabled: false
  existingClaim: ""
  mountPath: /var/lib/omb/results
#
# To "pin" CPU usage, set requests == limits (Guaranteed QoS).
# Examples:
#   driverCpuRequest: 500m
#   driverCpuLimit: 500m
#driverCpuRequest: 1000m
#driverCpuLimit: 1000m

# benchmark-worker defaults to a 4 GiB Java heap. Reserve another 2 GiB for
# direct buffers, metaspace, thread stacks, and other native allocations.
workersMemoryRequest: 6Gi
workersMemoryLimit: 6Gi
workersCpuRequest: 2000m
workersCpuLimit: 2000m
