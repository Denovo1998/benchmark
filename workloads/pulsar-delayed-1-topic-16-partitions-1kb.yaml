name: Pulsar delayed / 1 topic / 16 partitions / 1Kb

topics: 1
partitionsPerTopic: 16
keyDistributor: "NO_KEY"
messageSize: 1024
payloadFile: "payload/payload-1Kb.data"
subscriptionsPerTopic: 1
consumerPerSubscription: 1
producersPerTopic: 1
producerRate: 100000
consumerBacklogSizeGB: 0
testDurationMinutes: 15

# Optional workload-level override for message delay. If set to a value > 0,
# it will override the producer-level messageDelayMs configured in the driver.
# messageDelayMs: 5000

# Optional ratio of messages that will be sent with broker-side delivery delay, between 0.0 and 1.0.
# Delayed delivery in Pulsar requires the driver config to use
# consumer.subscriptionType: Shared or Key_Shared.
delayMessageRatio: 1.0

# Optional per-message random delay range in milliseconds. If maxMessageDelayMs > 0,
# each message will be delayed by a random value in [minMessageDelayMs, maxMessageDelayMs].
minMessageDelayMs: 10000
maxMessageDelayMs: 20000
